<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VYBE</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- FontAwesome for quick icons during development -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">
    
    <!-- Top Header -->
    <header class="app-header">
        <div class="logo">VYBE</div>
        <div class="profile-trigger" id="profileBtn">
            <img src="assets/images/default-avatar.png" alt="Profile">
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-content">
        <!-- Home Dashboard View -->
        <div id="view-home" class="view active">
            
            <div class="greeting-container">
                <h1 id="time-greeting">What's the lunch scene?</h1>
                <p>Let's stay on track today.</p>
            </div>

            <!-- Daily Nutrition Dashboard -->
            <div class="nutrition-card card">
                <div class="calories-main">
                    <h2>1,240 <span class="subtext">/ 2,100 kcal</span></h2>
                    <div class="progress-bar"><div class="progress fill-cyan" style="width: 59%;"></div></div>
                </div>
                <div class="macros-row">
                    <div class="macro">
                        <span class="label">Protein</span>
                        <span class="value">85g</span>
                        <div class="progress-bar mini"><div class="progress fill-lime" style="width: 70%;"></div></div>
                    </div>
                    <div class="macro">
                        <span class="label">Carbs</span>
                        <span class="value">120g</span>
                        <div class="progress-bar mini"><div class="progress fill-purple" style="width: 45%;"></div></div>
                    </div>
                    <div class="macro">
                        <span class="label">Fat</span>
                        <span class="value">42g</span>
                        <div class="progress-bar mini"><div class="progress fill-magenta" style="width: 60%;"></div></div>
                    </div>
                </div>
            </div>

            <!-- Prominent Food Photo Scanner Button -->
            <button class="primary-action-btn" id="scanFoodBtn">
                <i class="fa-solid fa-camera"></i> Scan Food
            </button>

            <!-- Image Preview Container (Hidden by default) -->
            <div id="food-preview-container" style="display: none; text-align: center; margin-bottom: 20px;">
                <img id="food-image-preview" style="width: 100%; border-radius: 12px; border: 2px solid var(--accent-cyan);" />
                <button id="analyzeFoodBtn" class="primary-action-btn" style="background-color: var(--accent-cyan); margin-top: 10px;">
                    <i class="fa-solid fa-robot"></i> Ask Mr. Vyb
                </button>
            </div>

            <!-- Hydration Tracker -->
            <div class="hydration-card card">
                <div class="hydration-header">
                    <h3>Hydration check!</h3>
                    <span class="value">1.5 / 3.0 L</span>
                </div>
                <div class="water-actions">
                    <button class="water-btn" style="background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 8px;">+ 250ml</button>
                    <button class="water-btn" style="background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 8px;">+ 500ml</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-target="view-home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" data-target="view-coach">
            <i class="fa-solid fa-bolt"></i>
            <span>Coach</span>
        </div>
        <div class="nav-item scanner-trigger" id="navScanBtn">
            <div class="scanner-circle">
                <i class="fa-solid fa-expand"></i>
            </div>
        </div>
        <div class="nav-item" data-target="view-race">
            <i class="fa-solid fa-flag-checkered"></i>
            <span>Race</span>
        </div>
        <div class="nav-item" data-target="view-community">
            <i class="fa-solid fa-users"></i>
            <span>Social</span>
        </div>
    </nav>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
