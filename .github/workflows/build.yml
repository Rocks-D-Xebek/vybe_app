name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npx tsc --noEmit

    # Generates the native android/ folder from app.json
    - name: Expo prebuild
      run: npx expo prebuild -p android --no-install --clean

    # Release build = JS bundled inside the APK, so it runs without a dev server.
    # Signed with the debug key: fine for installing on your phone, NOT for Google Play.
    - name: Build release APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: vybe-apk
        path: android/app/build/outputs/apk/release/app-release.apk
